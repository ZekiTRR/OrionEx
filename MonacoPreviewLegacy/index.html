<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Monaco Preview (Light)</title>
    <style>
      @font-face {
        font-family: "Zenith Nunito";
        src: url("./zenith-nunito-wght.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --editor-bg: #ffffff;
        --editor-radius: 0px;
        background: var(--editor-bg);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--editor-bg);
      }

      #preview-scale {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--editor-bg);
      }

      #loading-status {
        position: absolute;
        inset: 16px;
        z-index: 2;
        color: #6a737d;
        font: 12px/18px Consolas, monospace;
        pointer-events: none;
      }

      #editor {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--editor-bg);
      }

      html.rounded-editor,
      html.rounded-editor body,
      html.rounded-editor #preview-scale,
      html.rounded-editor #editor {
        border-radius: var(--editor-radius) !important;
        overflow: hidden !important;
      }

      body.orion-transparent .monaco-editor,
      body.orion-transparent .monaco-editor-background,
      body.orion-transparent .monaco-editor .margin,
      body.orion-transparent .monaco-editor .overflow-guard,
      body.orion-transparent .monaco-editor .inputarea.ime-input {
        background: transparent !important;
      }

      .suggest-widget {
        border: 1px solid #d0d7de !important;
        border-radius: 6px !important;
        overflow: hidden !important;
        box-shadow: 0 8px 24px #8c95a033 !important;
      }

      .suggest-widget .monaco-list,
      .suggest-widget .monaco-list-rows {
        background: #ffffff !important;
      }

      .suggest-widget .monaco-list-row.focused {
        background: #f3f4f6 !important;
      }

      .suggest-widget .monaco-list-row:hover:not(.focused) {
        background: #f6f8fa !important;
      }

      .suggest-widget .details-label,
      .suggest-widget .monaco-highlighted-label .highlight {
        color: #005fb8 !important;
      }

      .suggest-widget.orion-empty-suggest,
      .suggest-details-container.orion-empty-preview,
      .suggest-details.orion-empty-preview {
        display: none !important;
      }

      #zenith-editor-hint {
        position: absolute;
        right: 12px;
        bottom: 12px;
        left: 12px;
        z-index: 5;
        display: flex;
        justify-content: center;
        color: rgba(100, 100, 100, 0.7);
        font-family: "Zenith Nunito", sans-serif;
        font-size: 12px;
        font-style: italic;
        font-weight: 500;
        line-height: 16px;
        pointer-events: none;
        white-space: nowrap;
      }

      #zenith-editor-hint[hidden] {
        display: none;
      }

      #zenith-editor-help {
        margin: 0;
        padding: 0;
        border: 0;
        color: rgba(0, 95, 184, 0.8);
        background: transparent;
        font: inherit;
        text-decoration-line: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
        cursor: pointer;
        pointer-events: auto;
        transition: color 150ms ease;
      }

      #zenith-editor-help:hover {
        color: #005fb8;
      }
    </style>
  </head>
  <body>
    <div id="preview-scale">
      <div id="loading-status">Loading Monaco…</div>
      <div id="editor"></div>
      <div id="zenith-editor-hint" hidden>
        Ctrl+S save&nbsp;·&nbsp;Ctrl+W close&nbsp;·&nbsp;Ctrl+P commands&nbsp;·&nbsp;<button id="zenith-editor-help" type="button">learn more →</button>
      </div>
    </div>

    <script>
      window.addEventListener("error", function (event) {
        document.getElementById("loading-status").textContent =
          "Unable to load Monaco: " + event.message;
      });
      window.addEventListener("unhandledrejection", function (event) {
        const reason = event.reason && event.reason.message
          ? event.reason.message
          : String(event.reason);
        document.getElementById("loading-status").textContent =
          "Unable to load Monaco: " + reason;
      });
    </script>
    <script>
      var require = { paths: { vs: "./vs" } };
    </script>
    <script src="./vs/loader.js"
            onerror="document.getElementById('loading-status').textContent = 'Unable to load Monaco loader.'"></script>
    <script>
      const previewParameters = new URLSearchParams(window.location.search);
      const isTransparent = previewParameters.get("transparent") === "1";
      const requestedRadius = Math.max(0, Math.min(32, Number(previewParameters.get("radius") || 0)));
      const requestedBackground = previewParameters.get("bg");
      
      const shellBackground = isTransparent
        ? "#00000000"
        : (/^#[0-9a-f]{6}$/i.test(requestedBackground || "")
          ? requestedBackground
          : "#FFFFFF");

      document.documentElement.style.setProperty("--editor-bg", isTransparent ? "transparent" : shellBackground);
      document.body.classList.toggle("orion-transparent", isTransparent);
      document.documentElement.style.setProperty("--editor-radius", `${requestedRadius}px`);
      document.documentElement.classList.toggle("rounded-editor", requestedRadius > 0);

      require.onError = function (error) {
        document.getElementById("loading-status").textContent =
          "Unable to load Monaco: " + (error && error.message ? error.message : String(error));
      };

      require(["vs/editor/editor.main"], async function () {
        const fixedBackground = shellBackground;
        const themeName = isTransparent ? "light-transparent" : "light-vivid";

        const Kind = monaco.languages.CompletionItemKind;
        const SnippetRule = monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet;
        const keywordNames = [
          "and", "break", "do", "else", "elseif", "end", "false", "for",
          "function", "if", "in", "local", "nil", "not", "or", "repeat",
          "return", "then", "true", "until", "while"
        ];
        const functionDefs = [
          ["print(value)", "print(${1:value})", "Print a value to the output."],
          ["warn(message)", "warn(${1:message})", "Print a warning message."],
          ["error(message)", "error(${1:message})", "Raise a Lua error."],
          ["assert(value, message)", "assert(${1:value}, ${2:message})", "Assert that a value is truthy."],
          ["pairs(table)", "pairs(${1:table})", "Iterate over all table keys."],
          ["ipairs(table)", "ipairs(${1:table})", "Iterate over sequential table values."],
          ["pcall(function, ...)", "pcall(${1:functionName}${2:, ...})", "Call a function in protected mode."],
          ["xpcall(function, handler)", "xpcall(${1:functionName}, ${2:errorHandler})", "Call a function with an error handler."],
          ["require(module)", "require(${1:module})", "Load a module."],
          ["tonumber(value)", "tonumber(${1:value})", "Convert a value to a number."],
          ["tostring(value)", "tostring(${1:value})", "Convert a value to a string."],
          ["type(value)", "type(${1:value})", "Return the Lua type of a value."],
          ["typeof(value)", "typeof(${1:value})", "Return the Luau type of a value."],
          ["select(index, ...)", "select(${1:index}, ${2:...})", "Select values from a variadic argument list."],
          ["next(table, index)", "next(${1:table}${2:, index})", "Return the next table key and value."],
          ["task.spawn(function)", "task.spawn(${1:functionName})", "Run a function immediately on a new task."],
          ["task.defer(function)", "task.defer(${1:functionName})", "Defer a function until the end of the current cycle."],
          ["task.delay(seconds, function)", "task.delay(${1:seconds}, ${2:functionName})", "Run a function after a delay."],
          ["task.wait(seconds)", "task.wait(${1:seconds})", "Yield for an optional duration."],
          ["math.clamp(value, min, max)", "math.clamp(${1:value}, ${2:min}, ${3:max})", "Clamp a number to a range."],
          ["math.round(value)", "math.round(${1:value})", "Round a number to the nearest integer."],
          ["math.abs(value)", "math.abs(${1:value})", "Return the absolute value."],
          ["string.format(format, ...)", "string.format(${1:format}${2:, ...})", "Format a string."],
          ["string.find(value, pattern)", "string.find(${1:value}, ${2:pattern})", "Find a pattern in a string."],
          ["string.gsub(value, pattern, replacement)", "string.gsub(${1:value}, ${2:pattern}, ${3:replacement})", "Replace matches in a string."],
          ["table.insert(table, value)", "table.insert(${1:table}, ${2:value})", "Insert a value into a table."],
          ["table.remove(table, index)", "table.remove(${1:table}${2:, index})", "Remove a value from a table."],
          ["table.find(table, value)", "table.find(${1:table}, ${2:value})", "Find a value in a table."],
          ["table.clone(table)", "table.clone(${1:table})", "Create a shallow copy of a table."],
          ["coroutine.create(function)", "coroutine.create(${1:functionName})", "Create a coroutine."],
          ["coroutine.resume(thread)", "coroutine.resume(${1:thread})", "Resume a coroutine."]
        ];
        const moduleNames = [
          "math", "string", "table", "task", "coroutine", "utf8", "bit32",
          "game", "workspace", "script", "Enum", "shared", "_G", "getgc", "getgenv", "getrenv"
        ];

        const completionItems = [
          ...keywordNames.map((name) => ({
            label: name,
            filterText: name,
            insertText: name,
            kind: Kind.Keyword,
            detail: "Lua keyword",
            sortText: "0_" + name
          })),
          ...functionDefs.map(([label, insertText, documentation]) => ({
            label,
            filterText: label.slice(0, label.indexOf("(")),
            insertText,
            insertTextRules: SnippetRule,
            kind: Kind.Function,
            detail: "Lua / Luau function",
            documentation,
            sortText: "1_" + label
          })),
          ...moduleNames.map((name) => ({
            label: name,
            filterText: name,
            insertText: name,
            kind: Kind.Module,
            detail: "Lua / Luau global",
            sortText: "2_" + name
          }))
        ];

        const completionQueryAt = (model, position) => {
          const beforeCursor = model
            .getLineContent(position.lineNumber)
            .slice(0, position.column - 1);
          const match = /[\w.:]*$/.exec(beforeCursor);
          return match ? match[0] : "";
        };

        const matchingCompletionItems = (model, position) => {
          const query = completionQueryAt(model, position);
          const lowerQuery = query.toLowerCase();
          const range = {
            startLineNumber: position.lineNumber,
            endLineNumber: position.lineNumber,
            startColumn: position.column - query.length,
            endColumn: position.column
          };

          return completionItems
            .filter((item) => {
              if (!lowerQuery) return item.kind === Kind.Keyword;
              const candidate = item.filterText.toLowerCase();
              const tail = candidate.includes(".")
                ? candidate.slice(candidate.lastIndexOf(".") + 1)
                : candidate;
              return candidate.startsWith(lowerQuery) ||
                tail.startsWith(lowerQuery) ||
                candidate.includes(lowerQuery);
            })
            .slice(0, 80)
            .map((item) => ({ ...item, range }));
        };

        monaco.languages.registerCompletionItemProvider("lua", {
          triggerCharacters: [".", ":"],
          provideCompletionItems(model, position) {
            return { suggestions: matchingCompletionItems(model, position) };
          }
        });

        // Высококонтрастная и яркая светлая тема
        let editorThemeDefinition = {
          base: "vs",
          inherit: false,
          rules: [
            { token: "", foreground: "24292F" },
            { token: "comment", foreground: "6A737D", fontStyle: "italic" },
            { token: "keyword", foreground: "A626A4", fontStyle: "bold" },
            { token: "keyword.control", foreground: "A626A4", fontStyle: "bold" },
            { token: "keyword.operator", foreground: "0184BC" },
            { token: "operator", foreground: "0184BC" },
            { token: "string", foreground: "1E7E34" },
            { token: "string.escape", foreground: "D9480F" },
            { token: "number", foreground: "D9480F" },
            { token: "constant", foreground: "D9480F" },
            { token: "regexp", foreground: "E45649" },
            { token: "type", foreground: "986801" },
            { token: "struct", foreground: "986801" },
            { token: "class", foreground: "986801" },
            { token: "interface", foreground: "986801" },
            { token: "enum", foreground: "986801" },
            { token: "namespace", foreground: "986801" },
            { token: "function", foreground: "005FB8" },
            { token: "method", foreground: "005FB8" },
            { token: "entity.name.function", foreground: "005FB8" },
            { token: "variable", foreground: "24292F" },
            { token: "variable.predefined", foreground: "005FB8" },
            { token: "variable.parameter", foreground: "24292F" },
            { token: "tag", foreground: "A626A4" },
            { token: "attribute.name", foreground: "986801" },
            { token: "attribute.value", foreground: "1E7E34" },
            { token: "delimiter", foreground: "24292F" }
          ],
          colors: {
            "editor.background": fixedBackground,
            "editor.foreground": "#24292F",
            "editorCursor.foreground": "#005FB8",
            "editorLineNumber.foreground": "#8C95A0",
            "editorLineNumber.activeForeground": "#1F2328",
            "editor.lineHighlightBackground": "#F6F8FA",
            "editor.selectionBackground": "#B4D5FE",
            "editor.inactiveSelectionBackground": "#E1DFDD",
            "editor.selectionHighlightBackground": "#B4D5FE80",
            "editor.findMatchBackground": "#FFD33D88",
            "editor.findMatchHighlightBackground": "#FFEAA788",
            "editor.hoverHighlightBackground": "#F0F2F5",
            "editor.wordHighlightBackground": "#D0D7DE80",
            "editor.wordHighlightStrongBackground": "#D0D7DEA0",
            "editorWhitespace.foreground": "#D0D7DE",
            "editorIndentGuide.background": "#E1E4E8",
            "editorIndentGuide.activeBackground": "#959DA5",
            "editorGutter.background": fixedBackground,
            "editorPane.background": fixedBackground,
            "minimap.background": fixedBackground,
            "scrollbar.shadow": "#00000000",
            "scrollbarSlider.background": "#8C95A033",
            "scrollbarSlider.hoverBackground": "#8C95A066",
            "scrollbarSlider.activeBackground": "#8C95A099"
          }
        };

        monaco.editor.defineTheme(themeName, editorThemeDefinition);

        const editor = monaco.editor.create(document.getElementById("editor"), {
          value: [
            "local a = 100",
            "for _, obj in getgc(false) do",
            "    warn(\"Test\")",
            "end"
          ].join("\n"),
          language: "lua",
          theme: themeName,
          readOnly: false,
          domReadOnly: false,
          largeFileOptimizations: true,
          maxTokenizationLineLength: 10000,
          "semanticHighlighting.enabled": false,
          renderValidationDecorations: "off",
          codeLens: false,
          inlayHints: { enabled: "off" },
          minimap: { enabled: false },
          fontSize: 14,
          lineHeight: 20,
          suggestFontSize: 13,
          suggestLineHeight: 18,
          quickSuggestions: false,
          quickSuggestionsDelay: 50,
          wordBasedSuggestions: "off",
          suggestOnTriggerCharacters: false,
          tabCompletion: "off",
          inlineSuggest: { enabled: false },
          acceptSuggestionOnEnter: "on",
          acceptSuggestionOnCommitCharacter: true,
          suggestSelection: "first",
          snippetSuggestions: "top",
          suggest: {
            showKeywords: true,
            showFunctions: true,
            showModules: true,
            showSnippets: true,
            showWords: true,
            preview: false,
            showStatusBar: false,
            localityBonus: true,
            insertMode: "replace",
            snippetsPreventQuickSuggestions: false
          },
          scrollBeyondLastLine: false,
          automaticLayout: true,
          tabSize: 4,
          wordWrap: "off",
          folding: true,
          links: true,
          renderWhitespace: "none",
          glyphMargin: true,
          lineNumbersMinChars: 2,
          lineDecorationsWidth: 0,
          stickyScroll: { enabled: false },
          renderLineHighlight: "all",
          overviewRulerBorder: false,
          hideCursorInOverviewRuler: true,
          padding: { top: 0, bottom: 2 },
          fixedOverflowWidgets: true,
          scrollbar: { useShadows: false },
          bracketPairColorization: { enabled: false },
          colorDecorators: false,
          experimentalWhitespaceRendering: "svg",
          stopRenderingLineAfter: 5000,
          emptySelectionClipboard: false,
          smoothScrolling: false,
          cursorSmoothCaretAnimation: "off",
          renderControlCharacters: false,
          unicodeHighlight: {
            ambiguousCharacters: false,
            invisibleCharacters: false,
            nonBasicASCII: false
          },
          occurrencesHighlight: "off",
          selectionHighlight: false,
          contextmenu: true
        });

        editor.addCommand(
          monaco.KeyCode.Tab,
          () => editor.trigger("keyboard", "acceptSelectedSuggestion", {}),
          "suggestWidgetVisible"
        );

        editor.onDidType((text) => {
          if (/^[\w.:]+$/.test(text)) {
            const model = editor.getModel();
            const position = editor.getPosition();
            if (model && position && matchingCompletionItems(model, position).length > 0) {
              editor.trigger("keyboard", "editor.action.triggerSuggest", {});
            } else {
              editor.trigger("keyboard", "hideSuggestWidget", {});
            }
          }
        });

        const normalizePopupText = (value) =>
          String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
        const suppressEmptyCompletionChrome = () => {
          document.querySelectorAll(".suggest-widget").forEach((widget) => {
            const text = normalizePopupText(widget.textContent);
            const isEmpty = text === "no suggestions." || text === "no suggestions";
            widget.classList.toggle("orion-empty-suggest", isEmpty);
            if (isEmpty && widget.dataset.orionDismissQueued !== "1") {
              widget.dataset.orionDismissQueued = "1";
              queueMicrotask(() => {
                editor.trigger("orion", "hideSuggestWidget", {});
                delete widget.dataset.orionDismissQueued;
              });
            }
          });

          document.querySelectorAll(".suggest-details-container, .suggest-details")
            .forEach((details) => {
              const text = normalizePopupText(details.textContent);
              details.classList.toggle(
                "orion-empty-preview",
                text === "no preview available" || text === "no preview available.");
            });
        };
        let popupScanQueued = false;
        const schedulePopupScan = () => {
          if (popupScanQueued) return;
          popupScanQueued = true;
          window.requestAnimationFrame(() => {
            popupScanQueued = false;
            suppressEmptyCompletionChrome();
          });
        };
        const popupObserver = new MutationObserver(schedulePopupScan);
        const completionSurface = document.querySelector(".overflowingContentWidgets") || document.body;
        popupObserver.observe(completionSurface, {
          childList: true,
          subtree: true,
          characterData: true,
          attributes: true,
          attributeFilter: ["class"]
        });
        suppressEmptyCompletionChrome();

        const sendToHost = (payload) => {
          if (typeof window.invokeCSharpAction === "function") {
            window.invokeCSharpAction(JSON.stringify(payload));
          }
        };

        const zenithEditorHint = document.getElementById("zenith-editor-hint");
        const updateZenithEditorHint = () => {
          const model = editor.getModel();
          const value = model ? model.getValue().trim() : "";
          zenithEditorHint.hidden = true;
        };

        window.orbitRequestExecute = () => {
          const model = editor.getModel();
          sendToHost({
            type: "executeRequested",
            content: model ? model.getValue() : ""
          });
        };

        window.orionRequestSnapshot = () => {
          const model = editor.getModel();
          sendToHost({
            type: "contentSnapshot",
            content: model ? model.getValue() : ""
          });
        };

        let applyingHostContent = false;
        window.orbitSetContent = (content, language) => {
          const model = editor.getModel();
          if (!model) return;

          applyingHostContent = true;
          if (model.getValue() !== String(content ?? "")) {
            model.setValue(String(content ?? ""));
          }
          if (language) {
            monaco.editor.setModelLanguage(model, language);
          }
          editor.setPosition({ lineNumber: 1, column: 1 });
          editor.revealPosition({ lineNumber: 1, column: 1 });
          applyingHostContent = false;
          editor.focus();
          publishCursorPosition();
        };

        const publishCursorPosition = () => {
          const position = editor.getPosition();
          const model = editor.getModel();
          if (!position || !model) {
            return;
          }

          sendToHost({
            type: "cursorPosition",
            line: position.lineNumber,
            column: position.column,
            lineCount: model.getLineCount()
          });
        };

        window.orionLayout = () => editor.layout();

        window.orbitUpdateEditorOptions = (raw) => {
          if (!editor || raw == null) return;
          try {
            const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
            editor.updateOptions(parsed);
          } catch (error) {
            console.warn("orbitUpdateEditorOptions failed", error);
          }
        };

        editor.onDidChangeCursorPosition(publishCursorPosition);
        editor.onDidChangeModelContent((event) => {
          if (applyingHostContent) return;
          sendToHost({
            type: "contentChangedDelta",
            changes: event.changes.map((change) => ({
              offset: change.rangeOffset,
              length: change.rangeLength,
              text: change.text
            }))
          });
        });

        document.getElementById("loading-status").remove();
        document.body.dataset.ready = "true";
        editor.focus();
        publishCursorPosition();
        sendToHost({ type: "ready" });
      });
    </script>
  </body>
</html>
