<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Monaco Preview</title>
    <style>
      @font-face {
        font-family: "Zenith Nunito";
        src: url("./zenith-nunito-wght.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --editor-bg: transparent;
        --editor-radius: 0px;
        --orion-window-start: #181a1b;
        --orion-window-end: #08090a;
        --orion-widget: #181b1d;
        --orion-widget-selection: #292d32;
        --orion-widget-hover: #22262a;
        --orion-widget-border: #303235;
        background: var(--editor-bg);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--editor-bg);
      }

      #preview-scale {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--editor-bg);
      }

      #loading-status {
        position: absolute;
        inset: 16px;
        z-index: 2;
        color: #858585;
        font: 12px/18px Consolas, monospace;
        pointer-events: none;
      }

      #editor {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--editor-bg);
      }

      html.rounded-editor,
      html.rounded-editor body,
      html.rounded-editor #preview-scale,
      html.rounded-editor #editor {
        border-radius: var(--editor-radius) !important;
        overflow: hidden !important;
      }

      body.orion-transparent .monaco-editor,
      body.orion-transparent .monaco-editor-background,
      body.orion-transparent .monaco-editor .margin,
      body.orion-transparent .monaco-editor .overflow-guard,
      body.orion-transparent .monaco-editor .inputarea.ime-input {
        background: transparent !important;
      }

      body.orion-surface {
        /* This is the exact Orion window gradient, positioned as though the
           browser occupied the entire 896.4 x 558 shell. Monaco itself still
           contributes no editor background; this only continues the native
           surface through WebView2's Windows airspace. */
        background-image: linear-gradient(
          122.2466557642525deg,
          var(--orion-window-start) 0%,
          var(--orion-window-end) 37.019%
        ) !important;
        background-size: 896.4px 558px !important;
        background-position: -10.8px -120.6px !important;
        background-repeat: no-repeat !important;
      }

      body.orion-surface #preview-scale,
      body.orion-surface #editor {
        background: transparent !important;
      }

      .suggest-widget {
        border: 1px solid var(--orion-widget-border) !important;
        border-radius: 6px !important;
        overflow: hidden !important;
        box-shadow: 0 10px 28px #00000066 !important;
      }

      .suggest-widget .monaco-list,
      .suggest-widget .monaco-list-rows {
        background: var(--orion-widget) !important;
      }

      .suggest-widget .monaco-list-row.focused {
        background: var(--orion-widget-selection) !important;
      }

      .suggest-widget .monaco-list-row:hover:not(.focused) {
        background: var(--orion-widget-hover) !important;
      }

      .suggest-widget .details-label,
      .suggest-widget .monaco-highlighted-label .highlight {
        color: #dcdcaa !important;
      }

      /* Monaco otherwise leaves a framed completion surface on screen when
         a typed prefix resolves to no items. Empty result/preview chrome is
         intentionally absent in every Orion shell. */
      .suggest-widget.orion-empty-suggest,
      .suggest-details-container.orion-empty-preview,
      .suggest-details.orion-empty-preview {
        display: none !important;
      }

      #zenith-editor-hint {
        position: absolute;
        right: 12px;
        bottom: 12px;
        left: 12px;
        z-index: 5;
        display: flex;
        justify-content: center;
        color: rgba(154, 154, 154, 0.5);
        font-family: "Zenith Nunito", sans-serif;
        font-size: 12px;
        font-style: italic;
        font-weight: 400;
        line-height: 16px;
        pointer-events: none;
        white-space: nowrap;
      }

      #zenith-editor-hint[hidden] {
        display: none;
      }

      #zenith-editor-help {
        margin: 0;
        padding: 0;
        border: 0;
        color: rgba(154, 154, 154, 0.6);
        background: transparent;
        font: inherit;
        text-decoration-line: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
        cursor: pointer;
        pointer-events: auto;
        transition: color 150ms ease;
      }

      #zenith-editor-help:hover {
        color: rgba(154, 154, 154, 0.9);
      }
    </style>
  </head>
  <body>
    <div id="preview-scale">
      <div id="loading-status">Loading Monaco…</div>
      <div id="editor"></div>
      <div id="zenith-editor-hint" hidden>
        Ctrl+S save&nbsp;·&nbsp;Ctrl+W close&nbsp;·&nbsp;Ctrl+P commands&nbsp;·&nbsp;<button id="zenith-editor-help" type="button">learn more →</button>
      </div>
    </div>

    <script>
      window.addEventListener("error", function (event) {
        document.getElementById("loading-status").textContent =
          "Unable to load Monaco: " + event.message;
      });
      window.addEventListener("unhandledrejection", function (event) {
        const reason = event.reason && event.reason.message
          ? event.reason.message
          : String(event.reason);
        document.getElementById("loading-status").textContent =
          "Unable to load Monaco: " + reason;
      });
    </script>
    <script>
      var require = { paths: { vs: "./vs" } };
    </script>
    <script src="./vs/loader.js"
            onerror="document.getElementById('loading-status').textContent = 'Unable to load Monaco loader.'"></script>
    <script>
      // Luau LSP (luau-lsp.exe) bridge configuration; the client attaches to
      // every Monaco model automatically and exposes window.__lspReady, which
      // the static fallback provider below uses as its gate.
      window.OrionLspConfig = { language: "lua", extension: "lua" };
    </script>
    <script src="./lsp-client.js"></script>
    <script>
      const previewParameters = new URLSearchParams(window.location.search);
      const isXenoTheme = previewParameters.get("theme") === "xeno";
      const isBlueTheme = previewParameters.get("theme") === "blue";
      const isBunniTheme = previewParameters.get("theme") === "bunni";
      const isTransparent = previewParameters.get("transparent") === "1";
      const isOrionSurface = previewParameters.get("surface") === "orion";
      const isAwpSurface = previewParameters.get("shell") === "awp";
      const isZenithSurface = previewParameters.get("shell") === "zenith";
      const requestedRadius = Math.max(0, Math.min(32, Number(previewParameters.get("radius") || 0)));
      const xenoBackground = "#050505";
      const requestedBackground = previewParameters.get("bg");
      const shellBackground = (isTransparent || isOrionSurface)
        ? "#00000000"
        : (/^#[0-9a-f]{6}$/i.test(requestedBackground || "")
          ? requestedBackground
          : (isXenoTheme ? xenoBackground : "#101216"));
      // Synapse V3's default shell-custom theme derives the active-line tint
      // from the editor canvas (the source uses RGB + 18), rather than a
      // fixed VS Code highlight colour.
      const addChannel = (channel) => Math.min(255, parseInt(channel, 16) + 18).toString(16).padStart(2, "0");
      const editorLineHighlight = isOrionSurface
        ? "#080A0C99"
        : isTransparent
        ? "#00000000"
        : shellBackground.replace(/^#/, "").length === 6
        ? "#" + addChannel(shellBackground.slice(1, 3)) + addChannel(shellBackground.slice(3, 5)) + addChannel(shellBackground.slice(5, 7))
        : "#121212";
      document.documentElement.style.setProperty(
        "--editor-bg",
        isAwpSurface
          ? "#191818"
          : ((isTransparent || isOrionSurface) ? "transparent" : shellBackground));
      document.body.classList.toggle("orion-transparent", isTransparent || isOrionSurface);
      document.body.classList.toggle("orion-surface", isOrionSurface);
      document.documentElement.style.setProperty("--editor-radius", `${requestedRadius}px`);
      document.documentElement.classList.toggle("rounded-editor", requestedRadius > 0);

      require.onError = function (error) {
        document.getElementById("loading-status").textContent =
          "Unable to load Monaco: " + (error && error.message ? error.message : String(error));
      };

      require(["vs/editor/editor.main"], async function () {
        const fixedBackground = shellBackground;
        const themeName = isZenithSurface
          ? "zenith-transparent"
          : ((isTransparent || isOrionSurface)
            ? "orion-transparent"
            : (isBlueTheme ? "synapse-blue-default" : (isXenoTheme ? "xeno-fixed" : (isBunniTheme ? "bunni-fixed" : "orbit-fixed"))));
        const defaultTokenRule = { token: "", foreground: "D4D4D4" };
        if (!isTransparent && !isOrionSurface) {
          defaultTokenRule.background = fixedBackground.slice(1);
        }

        const Kind = monaco.languages.CompletionItemKind;
        const SnippetRule = monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet;
        const keywordNames = [
          "and", "break", "do", "else", "elseif", "end", "false", "for",
          "function", "if", "in", "local", "nil", "not", "or", "repeat",
          "return", "then", "true", "until", "while"
        ];
        const functionDefs = [
          ["print(value)", "print(${1:value})", "Print a value to the output.", ""],
          ["warn(message)", "warn(${1:message})", "Print a warning message.", ""],
          ["error(message)", "error(${1:message})", "Raise a Lua error.", ""],
          ["assert(value, message)", "assert(${1:value}, ${2:message})", "Assert that a value is truthy.", ""],
          ["pairs(table)", "pairs(${1:table})", "Iterate over all table keys.", ""],
          ["ipairs(table)", "ipairs(${1:table})", "Iterate over sequential table values.", ""],

        const serviceDefs = [

          ["ReplicatedStorage", "ReplicatedStorage", "Shared container accessible from server and clients."],

          ["Chat", "Chat", "In-game chat system."],
          ["LocalizationService", "LocalizationService", "Locale of the current player."],

        // Roblox type constructors — each carries an explicit `scope` (e.g. "Vector3")
        // that the completion filter uses to narrow results when the user types
        // `Vector3.` — without this, every method in the file would match.
        const typeCtorDefs = [
          ["Vector3.new(x, y, z)", "Vector3.new(${1:x}, ${2:y}, ${3:z})", "Create a Vector3 from components.", "Vector3"],
          ["Vector3.zero", "Vector3.zero", "Vector3 (0, 0, 0).", "Vector3"],
          ["Vector3.one", "Vector3.one", "Vector3 (1, 1, 1).", "Vector3"],
          ["Vector3.xAxis", "Vector3.xAxis", "Unit vector along X axis.", "Vector3"],

          ["Vector2.new(x, y)", "Vector2.new(${1:x}, ${2:y})", "Create a Vector2 from components.", "Vector2"],

          ["Vector2.one", "Vector2.one", "Vector2 (1, 1).", "Vector2"],

          ["CFrame.lookAt(at, lookAt)", "CFrame.lookAt(${1:at}, ${2:lookAt})", "CFrame positioned at at, looking at lookAt.", "CFrame"],

        const methodDefs = [

          const query = completionQueryAt(model, position);

          // *after* the last `:` / `.`, not the whole `game:GetService`.
          // Otherwise accepting `GetService` would erase the `game:` prefix.
          const replaceFrom = Math.max(0, position.column - tail.length);

            startLineNumber: position.lineNumber,
            endLineNumber: position.lineNumber,
            startColumn: replaceFrom,

          // Split into head (before last `:` / `.`) and tail (after). The head
          // is the "scope" the user is calling on (game, math, sUNC, …) and
          // the tail is what they're typing after the dot/colon.
          const colonIndex = lowerQuery.lastIndexOf(":");
          const dotIndex = lowerQuery.lastIndexOf(".");
          const splitIndex = Math.max(colonIndex, dotIndex);
          const hasScope = splitIndex >= 0;
          const head = hasScope ? lowerQuery.slice(0, splitIndex) : lowerQuery;

          //   rank 0: items whose filterText has the same head (e.g. "sUNC.hook")

            item.detail === "Roblox property" ||
            item.detail === "Roblox type constructor";

          const isLuaGlobal = (item) => item.detail === "Lua / Luau global";
          const lastTrigger = lowerQuery.charAt(splitIndex);
          // "executor" scopes: sUNC debug.* etc. live here. After these, we
          // want sUNC flat functions and NOT Roblox instance methods.
          // "roblox" scopes: game, script, workspace, parts, and all Roblox
          // service names. After these we want Roblox methods.
          // "module" scopes: math, string, table, task, coroutine, Vector3,

          const luaLibScopes = new Set([
            "math", "string", "table", "task", "coroutine", "utf8", "bit32", "buffer"

          const headIsLuaLib = luaLibScopes.has(head);

            const c = item.filterText.toLowerCase();
            const cHead = c.includes(".") ? c.slice(0, c.lastIndexOf(".")) : "";
            if (hasScope && cHead === head) return 0;            // exact scope match
            if (!hasScope) {
              if (cHead === "") return 2;
              if (c.startsWith(lowerQuery)) return 2;
              if (c.includes(lowerQuery)) return 3;
              return 99;
            }
            // Scoped query.
            if (isKeyword(item)) return 6;                        // keywords never after `.`/`:`
            if (headIsUNC) {
              if (cHead === "" && isSUNCFn(item)) return 1;       // sUNC flat functions rank high
              if (cHead === "" && (isRobloxMethod(item) || isRobloxService(item) || isPlainLua(item) || isLuaGlobal(item))) return 5;
              return 4;
            }
            if (headIsLuaLib) {
              if (cHead === "" && isPlainLua(item)) return 1;     // math.foo etc.
              if (cHead === "" && (isRobloxMethod(item) || isRobloxService(item) || isSUNCFn(item))) return 5;
              return 4;
            }
            // Roblox-instance / module scope: rank 1 = Roblox method/property
            // on any Instance, plus services. After `game.` (a dot, not a
            // colon) the user usually wants a service (`game.Workspace`),
            // not a method — so services get rank 1 on `.`.
            if (cHead === "" && isRobloxService(item)) {
              return lastTrigger === ":" ? 4 : 1;
            }
            if (cHead === "" && isRobloxMethod(item)) {
              return lastTrigger === ":" ? 1 : 2;
            }
            if (cHead === "" && isSUNCFn(item)) {
              return lastTrigger === ":" ? 5 : 2;
            }
            return 4;
          };

            // Empty query: keywords only.
            if (!lowerQuery) return item.kind === Kind.Keyword;
            const candidate = item.filterText.toLowerCase();
            const candidateHead = candidate.includes(".")
              ? candidate.slice(0, candidate.lastIndexOf("."))
              : "";
            const candidateTail = candidate.includes(".")
              ? candidate.slice(candidate.lastIndexOf(".") + 1)
              : candidate;

            // scope (`game:`, `Vector3.`) — keywords never appear after `.`
            // or `:` in real Lua.
            if (item.kind === Kind.Keyword) {
              return !hasScope && (tail === "" || "andbreakdoelseelseifendfalseforfunctionifinlocalnilnotorrepeatreturnthentrueuntilwhilecontinueexporttypeof".includes(tail));
            }

            //   (a) explicitly match that scope (cHead === head), or
            //   (b) have no scope (cHead === "") — i.e. Roblox methods callable
            //       on any Instance, or globals.

            if (tail === "" && !hasScope) {

        const zenithEditorHint = document.getElementById("zenith-editor-hint");
        const updateZenithEditorHint = () => {
          const model = editor.getModel();
          const value = model ? model.getValue().trim() : "";
          zenithEditorHint.hidden = !isZenithSurface ||
            (value !== "" && value !== "-- Loading... --");
        };
        document.getElementById("zenith-editor-help").addEventListener("click", () => {
          sendToHost({ type: "zenithHelpRequested" });
        });

        window.orbitRequestExecute = () => {
          const model = editor.getModel();
          sendToHost({
            type: "executeRequested",
            content: model ? model.getValue() : ""
          });
        };

        window.orionRequestSnapshot = () => {
          const model = editor.getModel();
          sendToHost({
            type: "contentSnapshot",
            content: model ? model.getValue() : ""
          });
        };

        let applyingHostContent = false;
        window.orbitSetContent = (content, language) => {
          const model = editor.getModel();
          if (!model) return;

          applyingHostContent = true;
          if (model.getValue() !== String(content ?? "")) {
            model.setValue(String(content ?? ""));
          }
          if (language) {
            monaco.editor.setModelLanguage(model, language);
          }
          updateZenithEditorHint();
          editor.setPosition({ lineNumber: 1, column: 1 });
          editor.revealPosition({ lineNumber: 1, column: 1 });
          applyingHostContent = false;
          editor.focus();
          publishCursorPosition();
        };

        // Bunni (and any host) can retune the editor font at runtime.
        window.orbitSetEditorFont = (family, size) => {
          const numeric = Math.max(8, Math.min(28, Number(size) || 15));
          const options = {
            fontSize: numeric,
            lineHeight: Math.max(12, Math.round(numeric * 1.8))
          };
          if (typeof family === "string" && family.length > 0) {
            options.fontFamily = "'" + family.replace(/'/g, "") + "', monospace";
          }
          editor.updateOptions(options);
        };

        const publishCursorPosition = () => {
          const position = editor.getPosition();
          const model = editor.getModel();
          if (!position || !model) {
            return;
          }

          sendToHost({
            type: "cursorPosition",
            line: position.lineNumber,
            column: position.column,
            lineCount: model.getLineCount()
          });
        };

        window.orionLayout = () => editor.layout();

        editor.onDidChangeCursorPosition(publishCursorPosition);
        editor.onDidChangeModelContent((event) => {
          updateZenithEditorHint();
          if (applyingHostContent) return;
          sendToHost({
            type: "contentChangedDelta",
            changes: event.changes.map((change) => ({
              offset: change.rangeOffset,
              length: change.rangeLength,
              text: change.text
            }))
          });
        });

        document.getElementById("loading-status").remove();
        updateZenithEditorHint();
        document.body.dataset.ready = "true";
        editor.focus();
        publishCursorPosition();
        sendToHost({ type: "ready" });
      });
    </script>
  </body>
</html>
